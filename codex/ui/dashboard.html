<main class="sidebar mp-console" id="shell">

<section class="mp-lcd now" id="nowPanel" aria-labelledby="nowHeading" hidden><div class="mp-lcd-h"><span id="nowHeading">NOW · 会话与额度</span><em id="quotaScope"></em></div><div id="nowThread"></div><div id="quota"></div><div class="quota-advice" id="quotaAdvice"></div><ul class="quota-hints" id="quotaHints" hidden></ul></section>
