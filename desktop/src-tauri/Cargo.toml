[package]
name = "modelplan-desktop"
version = "0.1.0"
description = "Model Plan menu bar app"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "modelplan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-http = "=2.8.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-store = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
