<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<title>ModelPlan launch field</title>
<!-- WP-22 (D298): the panel is one transparent rectangle; the launch-field component draws everything in it. -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="runtime/field-scene/launch-field.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
/* The rectangle fills the panel. Width and height are explicit: component 1.1.0's .lfw-mini (its small-window modifier)
   shares a name with its 16 px logo chip rule, which would otherwise size the root. */
#field{position:absolute;left:0;top:0;width:100vw;height:100vh;margin:0}
.field-close{position:absolute;right:12px;top:12px;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:#14151799;color:#e9eaeb;font-size:21px;line-height:1;cursor:pointer;z-index:7}
.field-close:focus-visible{outline:1px solid #f6d38a;outline-offset:2px}
</style>
<script type="module" src="src/field-page.js"></script>
</head>
<body class="field-page"><main id="field"></main></body>
</html>
