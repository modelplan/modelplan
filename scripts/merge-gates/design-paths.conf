# design-paths.conf: which public-repo paths are user-visible product code (owner-approved 2026-11-01).
# Read by the merge-queue gate (scripts/merge-gates/rules.mjs) and by the coordinator's design-touch check; keep the
# rules in both copies identical. A PR whose diff touches an "include" path that no "exclude" pattern matches is
# design-touching and needs "DESIGN: pass @ <head>" from the design-conformance review.
#
# One rule per line:  <include|exclude>  <surface or ->  <ERE on the repo-relative path>  [requirement-ID prefixes]
# - Excludes are checked first: a path that matches any exclude never counts.
# - The first include that matches names the path's surface.
# - The prefixes (requirements.yaml id prefixes) tell the design reviewer which registry entries belong to
#   the surface, besides the IDs the PR cites. A surface without prefixes still counts as design-touching.
# - Patterns are bash [[ =~ ]] EREs without spaces (use [[:space:]] if ever needed). Blank lines and # comments are ignored.

# Tests, verification, proofs, acceptance fixtures, checks and docs never count.
exclude  -  (^|/)(Tests|[A-Za-z]+Tests|__tests__|tests?|verification|Verification|Acceptance|[A-Za-z]*Proof|[A-Za-z]*Checks)/
exclude  -  (^|/)[A-Za-z0-9_-]+(Tests?|Spec)\.swift$|\.(test|spec)\.[cm]?[jt]sx?$|(^|/)check-[a-z0-9-]+\.sh$
exclude  -  ^docs/|\.md$|(^|/)(README|LICENSE|NOTICE|HISTORICAL-MIT)[^/]*$|(^|/)Package\.(swift|resolved)$
exclude  -  ^desktop/official-visuals/[a-z-]*baselines/
# The generated CLI pin identity (version and binary hashes, written by a CLI release pin bump) is not design (11-05, #511). Exact path: a name pattern would let any file skip review.
exclude  -  ^desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/CommunityConsentCLIIdentity\.generated\.swift$

# User-visible product code.
include  dock         ^desktop/native/ModelPlanDock/                    DOCK MENU COL MOT THM HINT LBL
include  integration  ^desktop/native/ModelPlanAppIntegration/          DOCK MENU FR HINT LBL THM
include  settings     ^desktop/native/ModelPlanSettings/                SET FR THM LBL
include  cockpit      ^desktop/cockpit/(src|web)/                       CKP COL MOT THM LBL
include  visuals      ^desktop/official-visuals/                        COL THM DOCK
# String tables and localisation, anywhere in the repo.
include  strings      \.(strings|stringsdict|xcstrings)$|\.lproj/|(^|/)Localizable[^/]*$|(^|/)(i18n|l10n|locales?)(/|\.[a-z]+$)   LBL

# pinonly <path-regex> <line-regex>: a file that matches is NOT design-touching when every changed line of it in
# the PR diff matches the line regex (owner 2026-11-01: a mechanical cockpit bundle pin update is not a UI change).
pinonly  ^desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/CommunityCockpitApplicationFactory\.swift$  ^[[:space:]]*(public[[:space:]]+)?(static[[:space:]]+let[[:space:]]+webSource[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"|"(community|official)"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}",?)[[:space:]]*$
