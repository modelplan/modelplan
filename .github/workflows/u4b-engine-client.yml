name: U4b engine client
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/child-environment.json
      - cli/cmd/modelplan/**
      - cli/internal/appserver/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - .github/workflows/u4b-engine-client.yml
  push:
    branches: [main]
    paths:
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/child-environment.json
      - cli/cmd/modelplan/**
      - cli/internal/appserver/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - .github/workflows/u4b-engine-client.yml
permissions:
  contents: read
concurrency:
  group: u4b-engine-client-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@0c86af351dd4417399682fdd5cc213189b91987d
    with:
      task: transport
      os: ${{ matrix.os }}
