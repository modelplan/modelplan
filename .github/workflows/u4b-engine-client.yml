name: U4b engine client
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/child-environment.json
      - cli/cmd/modelplan/**
      - cli/internal/appserver/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - .github/workflows/u4b-engine-client.yml
  push:
    branches: [main]
    paths:
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/child-environment.json
      - cli/cmd/modelplan/**
      - cli/internal/appserver/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - .github/workflows/u4b-engine-client.yml
permissions:
  contents: read
concurrency:
  group: u4b-engine-client-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@20ad90d9bb030703645140b9f067f2ae98df36dc
    with:
      task: transport
      os: ${{ matrix.os }}
