name: U11 native cockpit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/native/ModelPlanCockpitWeb/**'
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/verification/**'
      - 'clients/swift/ModelPlanEngineClient/**'
      - 'clients/swift/ModelPlanWire/**'
      - '.github/workflows/u11-native.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/native/ModelPlanCockpitWeb/**'
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/verification/**'
      - 'clients/swift/ModelPlanEngineClient/**'
      - 'clients/swift/ModelPlanWire/**'
      - '.github/workflows/u11-native.yml'
permissions:
  contents: read
concurrency:
  group: u11-native-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    # Same-repository PR/push/dispatch runs resolve the runner pool inside the reviewed
    # reusable workflow (dedicated ordinary Mac under MAC_CI_RUNNER_V2=split, hosted
    # otherwise, fork PRs always hosted); the job name stays "native".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@413ca9844bed560fd0fe9fb227fa137ebd1f6b33
    with:
      task: u11-native
      os: macos-15
