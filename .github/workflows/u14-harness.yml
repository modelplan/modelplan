name: U14 harness
on:
  pull_request:
    paths:
      - tools/u14/**
      - cli/internal/u14fixture/**
      - cli/internal/readers/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - cli/internal/appserver/**
      - cli/internal/rows/**
      - cli/cmd/modelplan/**
      - cli/go.mod
      - cli/go.sum
      - schema/app-cli/app-server.json
      - .github/workflows/u14-harness.yml
  push:
    branches: [main]
    paths:
      - tools/u14/**
      - cli/internal/u14fixture/**
      - cli/internal/readers/**
      - cli/internal/consent/**
      - cli/internal/quota/**
      - cli/internal/appserver/**
      - cli/internal/rows/**
      - cli/cmd/modelplan/**
      - cli/go.mod
      - cli/go.sum
      - schema/app-cli/app-server.json
      - .github/workflows/u14-harness.yml
  # Merge queue (D112): merge_group has no paths filter; queue-scope applies the list above.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: u14-harness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  # Merge queue only (D112): run the checks below on the group commit ("PR + latest main") when the group
  # changes a path from the pull_request list, unless the group commit's tree is the PR head's tree (the head
  # contains the base and its own run tested exactly this). Linux only; no Mac time in the queue.
  queue-scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_PATHS: ^(tools/u14/|cli/internal/u14fixture/|cli/internal/readers/|cli/internal/consent/|cli/internal/quota/|cli/internal/appserver/|cli/internal/rows/|cli/cmd/modelplan/|cli/go\.mod$|cli/go\.sum$|schema/app-cli/app-server\.json$|\.github/workflows/u14-harness\.yml$)
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          elif git diff --no-renames --name-only -z "$BASE" HEAD | grep -qzE "$QUEUE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group changes watched paths: running checks on the group commit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "group changes no watched path"
          fi

  engine:
    needs: queue-scope
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare disposable scratch
        run: mkdir -p .tmp
      - name: Fixture tooling tests and vet
        working-directory: cli
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: go vet ./internal/appserver/... ./internal/u14fixture/... && go test ./internal/appserver/... ./internal/u14fixture/... ./cmd/modelplan
      - name: Real-binary driver regressions
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: python3 -m unittest discover -s tools/u14/tests -p test_runner.py -v
      - name: U14 L1 profile with synthetic evidence
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: python3 tools/u14/verify.py --output .tmp/u14-l1
      - name: Real-binary engine scenarios and part-B bundle
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: python3 tools/u14/run.py --output .tmp/u14-engine
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u14-evidence-${{ github.sha }}
          path: |
            ${{ github.workspace }}/.tmp/u14-engine/bundle/
            ${{ github.workspace }}/.tmp/u14-engine/summary.json
            ${{ github.workspace }}/.tmp/u14-l1/bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Remove completed scratch
        if: always()
        run: rm -rf .tmp
