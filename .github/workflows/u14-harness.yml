name: U14 harness
on:
  pull_request:
    paths:
      - tools/u14/**
      - .github/workflows/u14-harness.yml
  push:
    branches: [main]
    paths:
      - tools/u14/**
      - .github/workflows/u14-harness.yml
permissions:
  contents: read
concurrency:
  group: u14-harness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shape and evidence regressions
        run: python3 -m unittest discover -s tools/u14/tests -v
      - name: Public source policy
        run: node scripts/check-source-policy.mjs
