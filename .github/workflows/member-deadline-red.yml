name: Member deadline old-code control
on:
  push:
    branches: [ci/member-deadline-red]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Assert old implementation fails mixed-route regression
        working-directory: cli
        run: |
          set +e
          go test -count=1 ./internal/appserver -run '^TestMixedRoutesDeadlineRequiresMatchingLiveGrant$' > "$RUNNER_TEMP/control.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/control.log"
          test "$rc" -ne 0
          grep -q 'incorrect route eligibility' "$RUNNER_TEMP/control.log"
