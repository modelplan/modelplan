name: e2e-journey
on:
  pull_request:
    paths: ["cli/**", "desktop/native/**", ".github/workflows/e2e-journey.yml", "!**/*.md"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths: ["cli/**", "desktop/native/**", ".github/workflows/e2e-journey.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-journey-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-journey:
    permissions:
      contents: read
      actions: read
    # Legacy (beta07-architecture) app journey. That app is frozen by foundation v2, and its consent contract
    # no longer matches the CLI (schema-2 consent). It now runs only on manual dispatch. The U14 runner
    # (tools/u14) carries the engine scenarios, and the new app's UI scenarios replace this job in U6/U8/U10.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin Xcode 26.6 (17F113)
        run: |
          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path
          WANT_VERSION, WANT_BUILD = '26.6', '17F113'
          for app in sorted(Path('/Applications').glob('Xcode*.app')):
              try:
                  info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
                  build = plistlib.loads((app / 'Contents/version.plist').read_bytes())['ProductBuildVersion']
              except (OSError, KeyError):
                  continue
              if info['CFBundleShortVersionString'] == WANT_VERSION and build == WANT_BUILD:
                  developer_dir = f'{app}/Contents/Developer'
                  break
          else:
              raise SystemExit(f'Pinned Xcode {WANT_VERSION} ({WANT_BUILD}) is not installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={developer_dir}\n')
          print(f'DEVELOPER_DIR={developer_dir}', flush=True)
          subprocess.run(['xcodebuild', '-version'], check=True, env={**os.environ, 'DEVELOPER_DIR': developer_dir})
          PY
      - name: Test journey oracle and synthetic provider
        run: python3 -m unittest discover -s desktop/native/tools/e2e-journey -p 'test_*.py' -v
      - name: Test journey runtime gates and actual card routing
        run: swift test --package-path desktop/native/ModelPlanAppIntegration --scratch-path "$RUNNER_TEMP/journey-tests" --jobs 2 -Xswiftc -DMODELPLAN_E2E_JOURNEY --filter JourneyCI
      - name: Build same-commit CLI and debug-only neutral app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/native/tools/e2e-journey/build.py "$RUNNER_TEMP/e2e-build"
      - name: Run real app journey without network or accounts
        run: python3 desktop/native/tools/e2e-journey/run.py "$RUNNER_TEMP/e2e-build" "$RUNNER_TEMP/e2e-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-journey-report
          path: ${{ runner.temp }}/e2e-report/
          if-no-files-found: warn
          retention-days: 3
