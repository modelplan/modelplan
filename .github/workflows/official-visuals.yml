name: Official visual pack
on:
  pull_request:
    paths:
      - desktop/official-visuals/**
      - desktop/third-party/fonts/**
      - source-policy.json
      - scripts/check-visual-pack.mjs
      - scripts/check-porthole-pack.mjs
      - scripts/visual-pack-format.mjs
      - scripts/check-font-pack.mjs
      - scripts/check-source-policy.mjs
      - scripts/tests/visual-pack.test.mjs
      - scripts/tests/porthole-pack.test.mjs
      - scripts/tests/font-pack.test.mjs
      - .github/workflows/official-visuals.yml
  push:
    branches: [main]
    paths:
      - desktop/official-visuals/**
      - desktop/third-party/fonts/**
      - source-policy.json
      - scripts/check-visual-pack.mjs
      - scripts/check-porthole-pack.mjs
      - scripts/visual-pack-format.mjs
      - scripts/check-font-pack.mjs
      - scripts/check-source-policy.mjs
      - scripts/tests/visual-pack.test.mjs
      - scripts/tests/porthole-pack.test.mjs
      - scripts/tests/font-pack.test.mjs
      - .github/workflows/official-visuals.yml
  # Merge queue (D112): merge_group has no paths filter; queue-scope applies the list above.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: official-visuals-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  # Merge queue only (D112): run the checks below on the group commit ("PR + latest main") when the group
  # changes a path from the pull_request list, unless the group commit's tree is the PR head's tree (the head
  # contains the base and its own run tested exactly this). Linux only; no Mac time in the queue.
  queue-scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_PATHS: ^(desktop/official-visuals/|desktop/third-party/fonts/|source-policy\.json$|scripts/check-visual-pack\.mjs$|scripts/check-porthole-pack\.mjs$|scripts/visual-pack-format\.mjs$|scripts/check-font-pack\.mjs$|scripts/check-source-policy\.mjs$|scripts/tests/visual-pack\.test\.mjs$|scripts/tests/porthole-pack\.test\.mjs$|scripts/tests/font-pack\.test\.mjs$|\.github/workflows/official-visuals\.yml$)
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          elif git diff --no-renames --name-only -z "$BASE" HEAD | grep -qzE "$QUEUE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group changes watched paths: running checks on the group commit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "group changes no watched path"
          fi

  integrity:
    needs: queue-scope
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/tests/visual-pack.test.mjs
      - run: node scripts/check-visual-pack.mjs
      - run: node --test scripts/tests/porthole-pack.test.mjs
      - run: node scripts/check-porthole-pack.mjs
      - run: node --test scripts/tests/font-pack.test.mjs
      - run: node scripts/check-font-pack.mjs
      - run: node scripts/check-source-policy.mjs
