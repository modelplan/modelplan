name: Official Dock geometry
on:
  pull_request:
    paths:
      - 'desktop/official-visuals/dock/**'
      - 'desktop/third-party/dock-resources/**'
      - 'desktop/native/ModelPlanDock/Native/DockInstrumentRenderer.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/T2ProductionAppearance.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/S1Gallery/**'
      - 'desktop/native/ModelPlanAppIntegration/Sources/S1GalleryCore/**'
      - 'desktop/native/ModelPlanAppIntegration/Package.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/ProductionDockFactory.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/T2MaterialSeamTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/OfficialDockEntryJourneyTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/DockWorkingHostInjectionTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/ZaiMarkSwitchTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/S1GalleryTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/DockContentProviderTests.swift'
      - 'desktop/native/ModelPlanDock/Native/DockInstrumentView.swift'
      - '.github/workflows/official-dock.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/official-visuals/dock/**'
      - 'desktop/third-party/dock-resources/**'
      - 'desktop/native/ModelPlanDock/Native/DockInstrumentRenderer.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/T2ProductionAppearance.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/S1Gallery/**'
      - 'desktop/native/ModelPlanAppIntegration/Sources/S1GalleryCore/**'
      - 'desktop/native/ModelPlanAppIntegration/Package.swift'
      - 'desktop/native/ModelPlanAppIntegration/Sources/ModelPlanAppIntegration/ProductionDockFactory.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/T2MaterialSeamTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/OfficialDockEntryJourneyTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/DockWorkingHostInjectionTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/ZaiMarkSwitchTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/S1GalleryTests.swift'
      - 'desktop/native/ModelPlanAppIntegration/Tests/ModelPlanAppIntegrationTests/DockContentProviderTests.swift'
      - 'desktop/native/ModelPlanDock/Native/DockInstrumentView.swift'
      - '.github/workflows/official-dock.yml'
permissions:
  contents: read
concurrency:
  group: official-dock-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic T2 geometry tests
        run: swift test --package-path desktop/official-visuals/dock --scratch-path .tmp/official-dock-tests --jobs 2
      - name: Generic material seam (no GUI)
        run: swift test --package-path desktop/native/ModelPlanAppIntegration --scratch-path .tmp/official-dock-seam --filter '(T2MaterialSeamTests|OfficialDockEntryJourneyTests|S1GalleryTests|ZaiMarkSwitchTests|DockWorkingHostInjectionTests|DockContentProviderTests)' --jobs 2
      - name: Original vendor marks and native fonts (no GUI)
        run: swift test --package-path desktop/third-party/dock-resources --scratch-path .tmp/official-dock-seam --jobs 2
