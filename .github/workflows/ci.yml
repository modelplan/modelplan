name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: CLI tests
        working-directory: cli
        run: go vet ./... && go test ./...
      # Child go-build inputs are outside Go's test-cache dependency tracking.
      - name: Real-binary app contract schemas and fixture drift (uncached)
        run: make app-cli-contract-check
  codex:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codex/package-lock.json
      - working-directory: codex
        run: npm ci --ignore-scripts && npm test && npm run build
      - run: git diff --exit-code -- codex/server.bundle.mjs codex/THIRD-PARTY-NOTICES.md
  claude-code:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test claude-code/tests/*.test.mjs
      - name: The plugins pin a published CLI release, checksums matching
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pin-cli.mjs --check
      - name: The CLI pins a published CodexBar release, checksums matching
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pin-codexbar.mjs --check
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: data/ is an exact mirror of the open data
        run: node --test scripts/data-sync.test.mjs && node scripts/data-sync.mjs --check
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/package-skill.mjs --check
      - run: python -m unittest discover -s skills/model-plan/evals -p 'test_*.py' -v
