name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
concurrency:
  group: public-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Merge queue only: when the group is one PR whose head already contains the queue base, the group's
  # tree is the head's tree, which the PR run already tested (the merge-queue gate requires that head's
  # checks green), so the group skips the heavy jobs. Any other group runs them on the combined commit.
  queue-reuse:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: reuse
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group differs from the PR head: running checks"
          fi
  cli:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: CLI tests
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Reader reason codes and writer canaries (uncached)
        working-directory: cli
        run: >-
          go test -count=1 ./internal/testenv ./internal/quota ./internal/connections ./cmd/modelplan
          -run 'Test(ReaderReason|NativeConnectionReasons|CodexRuntimeErrorOutput|KiroRuntimeErrorOutput|CodexProcessErrorOutput|CodexTimeoutKeepsSafeReason|RuntimeErrorsStayOutOfCLIJSONAndLogs)'
      - name: Release source rejects private Apple SPI
        working-directory: cli
        run: go run ./internal/releaseguard/cmd --root ..
      # Child go-build inputs are outside Go's test-cache dependency tracking.
      - name: Real-binary app contract schemas and fixture drift (uncached)
        run: make app-cli-contract-check
  # Both supported Node versions in one job: two setups cost seconds, a second runner costs a queue slot.
  codex:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex/package-lock.json
      - name: Codex plugin on Node 22
        working-directory: codex
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: The Node 22 bundle and its notices are committed as built
        run: git diff --exit-code -- codex/server.bundle.mjs codex/THIRD-PARTY-NOTICES.md
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Codex plugin on Node 24
        working-directory: codex
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: The Node 24 bundle and its notices are committed as built
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- codex/server.bundle.mjs codex/THIRD-PARTY-NOTICES.md
  # The small Linux checks in one job (they were mac-scope, claude-code on Linux, data and skill). Each check
  # step runs even when an earlier one failed, so one run reports every failure.
  checks:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # pin-cli.mjs --check compares with the base, HEAD^1; mac-scope diffs the merge commit
      # Ready PRs run the claude-code macOS leg only when something it tests changed; other events keep it.
      - name: "mac-scope: does a ready PR need the claude-code macOS leg"
        id: scope
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        run: |
          set -eu
          # A pull_request checkout is the merge commit, so its first parent is the base.
          # -z keeps paths Git would otherwise quote, such as non-ASCII names.
          if git diff --name-only -z HEAD^1 HEAD | grep -qzE '^(claude-code/|codex/hooks/|codex/cli-pin\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "claude-code: plugin tests"
        if: ${{ !cancelled() }}
        run: node --test claude-code/tests/*.test.mjs
      - name: "claude-code: native and cockpit strings follow the label rules"
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/lbl-coverage.test.mjs
      - name: "claude-code: the plugins pin a published CLI release, checksums matching"
        if: ${{ !cancelled() }}
        run: node scripts/pin-cli.mjs --check
      - name: "claude-code: the CLI pins a published CodexBar release, checksums matching"
        if: ${{ !cancelled() }}
        run: node scripts/pin-codexbar.mjs --check
      - name: "data: data/ is an exact mirror of the open data"
        if: ${{ !cancelled() }}
        run: node --test scripts/data-sync.test.mjs && node scripts/data-sync.mjs --check
      - name: "skill: package is current"
        if: ${{ !cancelled() }}
        run: node scripts/package-skill.mjs --check
      - name: "skill: evals"
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s skills/model-plan/evals -p 'test_*.py' -v
  # macOS leg of the claude-code tests. Draft PRs and merge-queue groups run Linux only; a ready PR runs it
  # when mac-scope finds a relevant change (macOS runners are scarce); pushes to main always run it.
  claude-code-macos:
    needs: checks
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || needs.checks.outputs.mac == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test claude-code/tests/*.test.mjs
      - name: Native and cockpit strings follow the label rules
        run: node --test scripts/tests/lbl-coverage.test.mjs
