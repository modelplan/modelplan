name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
concurrency:
  group: public-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Merge queue only: when the group is one PR whose head already contains the queue base, the group's
  # tree is the head's tree, which the PR run already tested (the merge-queue gate requires that head's
  # checks green), so the group skips the heavy jobs. Any other group runs them on the combined commit.
  queue-reuse:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: reuse
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group differs from the PR head: running checks"
          fi
  cli:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: CLI tests
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Reader reason codes and writer canaries (uncached)
        working-directory: cli
        run: >-
          go test -count=1 ./internal/testenv ./internal/quota ./internal/connections ./cmd/modelplan
          -run 'Test(ReaderReason|NativeConnectionReasons|CodexRuntimeErrorOutput|KiroRuntimeErrorOutput|CodexProcessErrorOutput|CodexTimeoutKeepsSafeReason|RuntimeErrorsStayOutOfCLIJSONAndLogs)'
      - name: Release source rejects private Apple SPI
        working-directory: cli
        run: go run ./internal/releaseguard/cmd --root ..
      # Child go-build inputs are outside Go's test-cache dependency tracking.
      - name: Real-binary app contract schemas and fixture drift (uncached)
        run: make app-cli-contract-check
  codex:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codex/package-lock.json
      - working-directory: codex
        run: npm ci --ignore-scripts && npm test && npm run build
      - run: git diff --exit-code -- codex/server.bundle.mjs codex/THIRD-PARTY-NOTICES.md
  # Ready PRs run the macOS leg only when something it tests changed; other events keep it.
  mac-scope:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: .github
      - id: scope
        run: |
          set -eu
          # A pull_request checkout is the merge commit, so its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(claude-code/|codex/hooks/|codex/cli-pin\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  claude-code:
    needs: [queue-reuse, mac-scope]
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    strategy:
      matrix:
        # Draft PRs and merge-queue groups run Linux only. A ready PR runs macOS when mac-scope finds a
        # relevant change (macOS runners are scarce); pushes to main always run it.
        os: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (github.event.pull_request.draft || needs.mac-scope.outputs.run != 'true'))) && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test claude-code/tests/*.test.mjs
      - name: The plugins pin a published CLI release, checksums matching
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pin-cli.mjs --check
      - name: The CLI pins a published CodexBar release, checksums matching
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pin-codexbar.mjs --check
  data:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: data/ is an exact mirror of the open data
        run: node --test scripts/data-sync.test.mjs && node scripts/data-sync.mjs --check
  skill:
    needs: queue-reuse
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-reuse.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/package-skill.mjs --check
      - run: python -m unittest discover -s skills/model-plan/evals -p 'test_*.py' -v
