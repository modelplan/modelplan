name: Dock host port seam
on:
  pull_request:
    paths:
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/ModelPlanDock/**'
      - '.github/workflows/dock-host-port.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/ModelPlanDock/**'
      - '.github/workflows/dock-host-port.yml'
permissions:
  contents: read
concurrency:
  group: dock-host-port-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Host port lifecycle, identity and factory regressions (no GUI)
        run: swift test --package-path desktop/native/ModelPlanAppIntegration --scratch-path .tmp/dock-host-port --filter '(DockInteractionHostPortTests|ProductionDockFactoryTests)' --jobs 2
