name: Dock host port seam
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/ModelPlanDock/**'
      - '.github/workflows/dock-host-port.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/native/ModelPlanAppIntegration/**'
      - 'desktop/native/ModelPlanDock/**'
      - '.github/workflows/dock-host-port.yml'
permissions:
  contents: read
concurrency:
  group: dock-host-port-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    # Runs through the reviewed reusable workflow (dedicated ordinary Mac under
    # MAC_CI_RUNNER_V2=split, hosted otherwise, fork PRs always hosted). The check name
    # changes from "contracts" to "contracts (dock host port)" because the U10 workflow's
    # own ubuntu "contracts" job must stay unambiguous in a shared check suite.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@413ca9844bed560fd0fe9fb227fa137ebd1f6b33
    with:
      task: dock-host-port
      os: macos-15
