# SPDX-License-Identifier: MIT
name: Verification pointer helper
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/native/verification/bin/pointer_drive*'
      - 'desktop/native/verification/bin/status_menu_drive.swift'
      - 'desktop/native/verification/StatusMenu/**'
      - '.github/workflows/verification-pointer-helper.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/native/verification/bin/pointer_drive*'
      - 'desktop/native/verification/bin/status_menu_drive.swift'
      - 'desktop/native/verification/StatusMenu/**'
      - '.github/workflows/verification-pointer-helper.yml'
concurrency:
  group: verification-pointer-helper-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  pointer-helper:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test without posting input or requesting permissions
        run: |
          swiftc -parse-as-library -DMODELPLAN_TEST_ONLY_SPI desktop/native/verification/StatusMenu/Sources/ModelPlanMenuVerification/*.swift desktop/native/verification/bin/status_menu_drive.swift desktop/native/verification/bin/pointer_drive.swift -o "$RUNNER_TEMP/pointer_drive"
          "$RUNNER_TEMP/pointer_drive" --self-test
      - name: Scoped menu locator and native receipt tests (no input/AX query)
        run: swift test --package-path desktop/native/verification/StatusMenu --scratch-path "$RUNNER_TEMP/menu-verification" --jobs 2 -Xswiftc -DMODELPLAN_TEST_ONLY_SPI
