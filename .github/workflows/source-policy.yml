name: source-policy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # PR heads share a group, so a newer push cancels the older run; each main commit gets its own group
  # and is never cancelled or left pending behind a later main commit.
  group: public-source-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-source-policy.mjs
      - run: node --test scripts/tests/workflow-policy.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix reader
      - run: npm test --prefix reader
