name: source-policy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-source-policy.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix core
      - run: npm test --prefix core
