name: macOS distribution
on:
  push:
    branches: [main]
    paths: ["desktop/native/**", "clients/swift/**", "cli/internal/releaseguard/**", "codex/cli-pin.json", ".github/workflows/macos-distribution.yml"]
  pull_request:
    paths: ["desktop/native/**", "clients/swift/**", "cli/internal/releaseguard/**", ".github/workflows/macos-distribution.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: macos-distribution-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  neutral-build:
    permissions:
      contents: read
      actions: read
    # No secrets or protected environment in the PR/build job. Same-repository runs go
    # through the reviewed reusable workflow (dedicated ordinary Mac under
    # MAC_CI_RUNNER_V2=split, hosted otherwise, fork PRs always hosted); ad-hoc neutral
    # packaging only — signing and publication stay hosted. The check name stays
    # "neutral-build".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@413ca9844bed560fd0fe9fb227fa137ebd1f6b33
    with:
      task: distribution
      os: macos-latest
