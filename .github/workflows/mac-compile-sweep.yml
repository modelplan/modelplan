# SPDX-License-Identifier: MIT
# Sweep for a missing mac-compile (owner D374, 11-21). The trigger run can be missed: #1129 head 4ec0791 never got a
# "mac-compile trigger" run (it was ready while based on another branch, then retargeted to main; fixed in
# mac-compile-trigger.yml by running on a base change). Every ~10 minutes this finds the open ready PRs that change
# desktop/native and have no mac-compile status or run at their head, and dispatches mac-compile.yml with pr and sha;
# and for a head whose compile passed while modelplan-gates still waits for it, it re-runs the gate
# (scripts/mac-compile/sweep.mjs). The merge gate requires the mac-compile success of a native head before merge.
#
# Trust boundary: main's scripts only (checkout of main, no PR code); the PR is read through the API. mac-compile.yml
# accepts a dispatch only from the owner account, so the dispatch uses the owner's comment token (secret
# PR_REVIEW_COMMENT_TOKEN of the pr-review environment, the one that posts verdicts); it needs Actions: write for this
# repository. mac-compile.yml's plan job re-validates the PR (open, ready, owner's, head = sha) itself.
name: mac-compile sweep
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-compile-sweep
  cancel-in-progress: false
jobs:
  sweep:
    if: github.repository == 'modelplan/modelplan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pr-review
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mac-compile/sweep.mjs
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_COMMENT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
