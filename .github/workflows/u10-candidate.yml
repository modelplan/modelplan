# SPDX-License-Identifier: MIT
name: U10 candidate interface
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/u10/**
      - tools/u14/**
      - desktop/native/**
      - desktop/cockpit/**
      - desktop/official-visuals/**
      - desktop/third-party/**
      - desktop/package.json
      - .github/workflows/u10-candidate.yml
  push:
    branches: [main]
    paths:
      - tools/u10/**
      - tools/u14/**
      - desktop/native/**
      - desktop/cockpit/**
      - desktop/official-visuals/**
      - desktop/third-party/**
      - desktop/package.json
      - .github/workflows/u10-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: u10-candidate-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, visual and OFL font integrity
        run: |
          node scripts/check-source-policy.mjs
          node scripts/check-visual-pack.mjs
          node scripts/check-font-pack.mjs
      - name: Packaging identity, release scaffold and U14 contracts
        run: |
          python3 -m unittest discover -s tools/u10/tests -v
          python3 -m unittest discover -s desktop/native/tools/distribution -p 'test_*.py' -v
          python3 -m unittest discover -s tools/u14/tests -p test_harness.py -v
  candidate:
    permissions:
      contents: read
      actions: read
    # Drafts run portable contracts first; macOS starts when ready, or by manual dispatch.
    # Same-repository runs go through the reviewed reusable workflow (dedicated ordinary Mac
    # under MAC_CI_RUNNER_V2=split, hosted otherwise, fork PRs always hosted); the check name
    # stays "candidate" and the exact PR head is still what is packaged and named.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: contracts
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@413ca9844bed560fd0fe9fb227fa137ebd1f6b33
    with:
      task: u10-candidate
      os: macos-latest
