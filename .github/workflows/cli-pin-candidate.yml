name: CLI candidate pin consistency
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
permissions:
  contents: read
concurrency:
  group: cli-pin-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cli-pin-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test the candidate gate
        run: python3 -m unittest discover -s desktop/native/tools/distribution -p test_cli_pin_consistency.py -v
      - name: Compare candidate or changed native pin to its release tag
        run: python3 desktop/native/tools/distribution/check_cli_pin_consistency.py --event "$GITHUB_EVENT_PATH"
