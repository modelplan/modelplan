name: U7 credential agent
on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/native/ModelPlanCredentialAgent/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - .github/workflows/u7-credential-agent.yml
  push:
    branches: [main]
    paths:
      - desktop/native/ModelPlanCredentialAgent/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - .github/workflows/u7-credential-agent.yml
permissions:
  contents: read
concurrency:
  group: u7-credential-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fake-contract:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test the standalone native adapter with fake matchers only
        run: swift test --package-path desktop/native/ModelPlanCredentialAgent --scratch-path "$RUNNER_TEMP/u7-credential-agent" --jobs 2
