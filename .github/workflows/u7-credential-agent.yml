name: U7 credential agent
on:
  pull_request:
    paths:
      - desktop/native/ModelPlanCredentialAgent/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - clients/swift/ModelPlanEngineStoreCore/**
      - desktop/native/ModelPlanEngineStore/**
      - .github/workflows/u7-credential-agent.yml
  push:
    branches: [main]
    paths:
      - desktop/native/ModelPlanCredentialAgent/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - clients/swift/ModelPlanEngineStoreCore/**
      - desktop/native/ModelPlanEngineStore/**
      - .github/workflows/u7-credential-agent.yml
permissions:
  contents: read
concurrency:
  group: u7-credential-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  fake-contract:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove two clean helper builds and two synthetic App embeddings
        run: python3 desktop/native/ModelPlanCredentialAgent/tools/build_fixed_helper.py --universal --output "$RUNNER_TEMP/u7-artifact"
      - name: Compile and test the standalone native adapter with fake matchers only
        env:
          U7_TEST_HELPER_BINARY: ${{ runner.temp }}/u7-artifact/modelplan-credential-agent
        run: swift test --package-path desktop/native/ModelPlanCredentialAgent --scratch-path "$RUNNER_TEMP/u7-credential-agent" --jobs 2
      - name: Exercise the normal U6 constructor with synthetic RPC and helper fixtures
        run: swift test --package-path desktop/native/ModelPlanCredentialAgent/IntegrationTests --scratch-path "$RUNNER_TEMP/u7-connection" --jobs 2
      - name: Check helper packaging and the permanent App-side credential boundary
        env:
          U7_TEST_HELPER_BINARY: ${{ runner.temp }}/u7-artifact/modelplan-credential-agent
        run: python3 -m unittest discover -s desktop/native/ModelPlanCredentialAgent/tools/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: u7-fixed-denial-helper-universal
          path: |
            ${{ runner.temp }}/u7-artifact/modelplan-credential-agent
            ${{ runner.temp }}/u7-artifact/credential-agent.json
            ${{ runner.temp }}/u7-artifact/proof.json
