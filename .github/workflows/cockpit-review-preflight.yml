name: Cockpit legacy lock preflight
on:
  push:
    branches: [ci/414-legacy-lock-preflight]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format affected Go sources
        run: gofmt -w cli/internal/speed/lock.go cli/internal/speed/legacy_lock_test.go cli/cmd/modelplan/legacy_marker_test.go
      - name: Regenerate notice views
        if: matrix.os != 'windows-latest'
        run: python3 scripts/third-party-notices.py --write
      - name: Save generated patch
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/legacy-generated.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-generated-${{ matrix.os }}
          path: ${{ runner.temp }}/legacy-generated.patch
      - name: Vet affected packages
        working-directory: cli
        run: go vet ./internal/speed ./internal/consent ./internal/quota ./cmd/modelplan
      - name: Cross-platform lock regressions
        working-directory: cli
        run: go test -count=1 -v ./internal/speed ./internal/consent ./internal/quota ./cmd/modelplan -run 'Test(FreshLegacyMarkerBlocksLedgerWrites|OldLegacyMarkerIsNotRemoved|FreshLegacyMarkerBlocksHistoryErasure|WindowsLockExcludesLiveAndReleasesKilledWriter|WindowsObservationWritesLedger|WindowsProjectLabelsOffAndHistoryErasure|ConsentMalformedAndLockFailClosed|KilledReaderReleasesKernelAdmission|LedgerWriterLockNeverStealsAgedLiveHolder|HistoryCleanupNeverStealsSlowWriterLocks|KilledWriterReleasesLedgerLockForCleanup|HistoryLedgerRewriteFailureLeavesOriginal)$'
      - name: Full Go tests and vet
        if: matrix.os == 'ubuntu-latest'
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Notice coverage regressions
        if: matrix.os != 'windows-latest'
        run: python3 scripts/third-party-notices.py && python3 -m unittest discover -s scripts/tests -p test_third_party_notices.py -v
      - name: macOS Swift notice manifests
        if: matrix.os == 'macos-latest'
        run: python3 scripts/third-party-notices.py --swift-manifests
      - name: Source policy
        if: matrix.os != 'windows-latest'
        run: node scripts/check-source-policy.mjs
