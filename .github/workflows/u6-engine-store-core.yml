# SPDX-License-Identifier: MIT
name: U6 engine store core
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clients/swift/ModelPlanEngineStoreCore/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/captures/**
      - .github/workflows/u6-engine-store-core.yml
  push:
    branches: [main]
    paths:
      - clients/swift/ModelPlanEngineStoreCore/**
      - clients/swift/ModelPlanEngineClient/**
      - clients/swift/ModelPlanWire/**
      - schema/app-cli/captures/**
      - .github/workflows/u6-engine-store-core.yml
permissions:
  contents: read
concurrency:
  group: u6-engine-store-core-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sequences:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: sequences
      os: ${{ matrix.os }}
