name: desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", "codex/ui/**", "codex/lib/**", "codex/cli-pin.json", "cli/internal/snapshot/**", "cli/internal/digest/**", "cli/internal/desktopcontract/**", "cli/internal/contracttest/**", "schema/**", "testdata/contract-v1/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "codex/ui/**", "codex/lib/**", "codex/cli-pin.json", "cli/internal/snapshot/**", "cli/internal/digest/**", "cli/internal/desktopcontract/**", "cli/internal/contracttest/**", "schema/**", "testdata/contract-v1/**", ".github/workflows/desktop.yml"]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      mac_ci_probe:
        description: Run only the owner-only native runner connectivity probe
        type: boolean
        default: false
      mac_ci_probe_mode:
        description: Native CLI or graphical-session probe
        type: choice
        options: [cli, gui]
        default: cli
      owner_test:
        description: Owner test build - package with the cockpit entry open (release packages keep it closed)
        type: boolean
        default: false
      gui:
        description: Run the GUI-native job on the single GUI test machine (the coordinator's dispatch queue owns its order)
        type: boolean
        default: false
      gui_pool:
        description: Where the GUI-native job runs (default follows the MAC_CI_GUI_POOL variable)
        type: choice
        options: [default, hosted, owner-mac]
        default: default
permissions:
  contents: read
concurrency:
  group: public-desktop-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Merge queue only: the queue is what tests "PR + latest main", because a PR no longer has to merge
  # main first. merge_group has no paths filter, so this job applies the pull_request list above: a
  # group that adds nothing under those paths, or whose tree is the PR head's tree (the head already
  # contains the base and its own run tested exactly this), skips the jobs below. The GUI leg never
  # runs here. trusted-mac.yml has no merge_group route to the owner's Mac pool, so native-headless
  # uses a hosted Mac here.
  queue-scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_PATHS: ^(desktop/|codex/ui/|codex/lib/|codex/cli-pin\.json$|cli/internal/snapshot/|cli/internal/digest/|cli/internal/desktopcontract/|cli/internal/contracttest/|schema/|testdata/contract-v1/|\.github/workflows/desktop\.yml$)
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          elif git diff --no-renames --name-only -z "$BASE" HEAD | grep -qzE "$QUEUE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group changes desktop paths: running checks on the group commit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "group changes no desktop path"
          fi

  app:
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Both editions: the official one from desktop/official-visuals/ (reserved license), then the
      # default community one, which must contain none of it.
      - run: npm run build:official
      - run: npm run build
      - run: |
          test ! -e app/dist/VISUAL-LICENSE.md
          grep -q '"edition": "community"' app/dist/build-edition.json
          cmp app/dist/app.css app/style.css
  shell:
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    # The Rust shell on Linux (a supported Tauri target): format, unit tests, a debug build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci --ignore-scripts && npm run build
      - working-directory: desktop/src-tauri
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
  native-partition:
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    # Static rules for the GUI/headless split of the native XCTest suite, on Linux, before any Mac
    # job: a class may run on the ordinary Mac runner only if its source uses no window server.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s desktop/native/tools/ci -p 'test_*.py' -v
      - run: python3 desktop/native/tools/ci/native_test_partition.py check

  cockpit-pins:
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    # Cockpit admission pins are never committed (D69): they are generated from the canonical build wherever the
    # App is compiled (package-neutral.sh, U11 native). On every PR head, main push and merge-queue group, build
    # both editions twice from this tree, require byte-identical output, check the reserved-visuals register, and
    # generate the pins the App would be compiled with. U11 native compiles and runs the App with them on PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pin generator and checker
        run: |
          python3 -B -m unittest discover -s desktop/native/verification/tests -p 'test_bundle_pin_guard.py' -v
          python3 -B -m unittest discover -s desktop/native/ModelPlanCockpitWeb -p 'test_*.py' -v
      - name: Build both editions, generate their pins, rebuild from scratch and require the same pins
        run: |
          npm ci --prefix desktop/cockpit --ignore-scripts
          npm run build --prefix desktop/cockpit
          npm run build:official --prefix desktop/cockpit
          python3 desktop/native/ModelPlanCockpitWeb/check-bundle-pins.py --write
          rm -rf desktop/cockpit/.tmp
          npm run build --prefix desktop/cockpit
          npm run build:official --prefix desktop/cockpit
          python3 desktop/native/ModelPlanCockpitWeb/check-bundle-pins.py --check
          test -z "$(git status --porcelain)"

  app-smoke:
    permissions:
      contents: read
      actions: read
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    # The actual Apple silicon Community bundle, with no secrets, live reader or displayed UI.
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: false
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact PR head, not the synthetic merge commit: the artifact name, BUILD.txt and
          # the bundle's ModelPlanPublicSource must all name the tree that was actually built.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.owner_test }}
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select newest installed Xcode for the release package
        run: |
          python3 - <<'PYCODE'
          import os, plistlib, re
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              version = plistlib.loads((app / 'Contents/Info.plist').read_bytes())['CFBundleShortVersionString']
              candidates.append((tuple(map(int, re.findall(r'\d+', version))), app))
          if not candidates:
              raise SystemExit('No installed Xcode')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={max(candidates)[1]}/Contents/Developer\n')
          PYCODE
      - name: Check smoke assertions and release identity negative controls
        run: python3 -m unittest discover -s desktop/native/tools/app-smoke -p 'test_*.py' -v
      - name: Fetch the approved prebuilt credential helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/native/tools/distribution/fetch_credential_artifact.py --output "$RUNNER_TEMP/credential-agent-input" --github-env "$GITHUB_ENV"
      - name: Fetch the current plugin CLI pin for the unverified smoke build
        run: python3 desktop/native/tools/distribution/release.py fetch-cli --pin codex/cli-pin.json --output "$RUNNER_TEMP/smoke-cli-archives"
      - name: Package the actual Apple silicon Community app with unverified consent identity
        env:
          PACKAGE_MODE: ${{ inputs.owner_test && '--owner-test' || '--unverified' }}
        run: bash desktop/native/tools/package-neutral.sh "$RUNNER_TEMP/smoke-cli-archives" "$RUNNER_TEMP/smoke-neutral-build" "$PACKAGE_MODE"
      - name: Require the bundled helper to be the plugin pin it was packaged from
        run: python3 desktop/native/tools/distribution/check_cli_pin_consistency.py --app "$RUNNER_TEMP/smoke-neutral-build/ModelPlan Community.app" --pin codex/cli-pin.json
      - name: Assert packaged production wiring (known baseline failures remain red)
        run: python3 desktop/native/tools/app-smoke/check-app-smoke.py "$RUNNER_TEMP/smoke-neutral-build/ModelPlan Community.app" "$RUNNER_TEMP/app-smoke-report" --expect-unverified
      # Interim until the v1 candidate workflow (#522) lands: the on-device lanes need the native app this job
      # packages, not the legacy Tauri DMG above. Unverified consent identity, cockpit off, ad-hoc signed.
      - name: Zip the packaged native app for on-device checks
        if: always()
        env:
          # The PR head, not the synthetic merge commit a pull_request run checks out.
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app="$RUNNER_TEMP/smoke-neutral-build/ModelPlan Community.app"
          [ -d "$app" ] || { echo "no packaged native app"; exit 0; }
          built=$(/usr/libexec/PlistBuddy -c 'Print :ModelPlanPublicSource' "$app/Contents/Info.plist")
          head=$(git rev-parse HEAD)
          if [ "$built" != "$SOURCE_SHA" ] || [ "$head" != "$SOURCE_SHA" ]; then
            echo "built source $built / checkout $head differs from label $SOURCE_SHA; no artifact" >&2; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/native-app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/native-app/ModelPlan-Community-native.zip"
          # The helper is the released CLI named by codex/cli-pin.json, not built from SOURCE_SHA's cli/.
          cli_pin=$(python3 -c 'import json; print(json.load(open("codex/cli-pin.json"))["version"])')
          printf '%s\n' "sourceSHA=$SOURCE_SHA" "runID=$GITHUB_RUN_ID" "runAttempt=$GITHUB_RUN_ATTEMPT" \
            "cliHelper=released v$cli_pin from codex/cli-pin.json (not built from sourceSHA)" > "$RUNNER_TEMP/native-app/BUILD.txt"
          (cd "$RUNNER_TEMP/native-app" && shasum -a 256 ModelPlan-Community-native.zip >> BUILD.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # preflight.py: native-app-test-<sha> is the owner test flavour (cockpit entry open, PF-08).
          name: native-app-${{ inputs.owner_test && 'test' || 'unverified' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-app/
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-app-smoke-report
          path: ${{ runner.temp }}/app-smoke-report/
          if-no-files-found: warn
          retention-days: 3

  native:
    name: native (${{ matrix.os }})
    # The GUI-native job occupies the ONE GUI test machine (runner label modelplan-mac-gui), and GitHub
    # schedules that machine FIFO with everything else, so urgent runs (owner test builds, ledger fixes)
    # waited behind routine ones. It now runs ONLY when this workflow is dispatched with gui=true (the
    # coordinator's ci-dispatch sends at most one such run at a time, highest priority first) or on a
    # non-draft PR that carries the gui-ci label; pushes and ordinary pull_request events skip it.
    # native-headless and the hosted app-smoke job still cover every push and ready PR head.
    if: ${{ (!inputs.mac_ci_probe && ((github.event_name == 'workflow_dispatch' && inputs.gui) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'gui-ci')))) && !(inputs.gui_pool == 'hosted' || (inputs.gui_pool != 'owner-mac' && vars.MAC_CI_GUI_POOL == 'hosted')) }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: native
      os: ${{ matrix.os }}

  native-hosted:
    name: native-hosted (${{ matrix.os }})
    # The GUI leg minus the ownerGui classes on hosted macos-15 (owner D62, 11-08), which has a real WindowServer
    # session, so several PRs' GUI legs run in parallel instead of queueing for the one GUI Mac. Selected by
    # MAC_CI_GUI_POOL=hosted or a gui_pool=hosted dispatch; same triggers as the job above.
    if: ${{ (!inputs.mac_ci_probe && ((github.event_name == 'workflow_dispatch' && inputs.gui) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'gui-ci')))) && (inputs.gui_pool == 'hosted' || (inputs.gui_pool != 'owner-mac' && vars.MAC_CI_GUI_POOL == 'hosted')) }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: native-hosted-gui
      os: ${{ matrix.os }}

  native-owner-gui:
    name: native-owner-gui (macos-latest)
    # The ownerGui classes of native-test-partition.json (they cannot finish on a hosted Mac) on the owner's GUI Mac,
    # paired with native-hosted above: together they are exactly the GUI leg.
    if: ${{ (!inputs.mac_ci_probe && ((github.event_name == 'workflow_dispatch' && inputs.gui) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'gui-ci')))) && (inputs.gui_pool == 'hosted' || (inputs.gui_pool != 'owner-mac' && vars.MAC_CI_GUI_POOL == 'hosted')) }}
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: native-owner-gui
      os: macos-latest

  native-headless:
    name: native-headless (macos-latest)
    needs: queue-scope
    if: ${{ !cancelled() && !inputs.mac_ci_probe && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: native-headless
      os: macos-latest

  runner-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_ci_probe && github.actor_id == '11829005' }}
    uses: modelplan/modelplan/.github/workflows/trusted-mac.yml@01340deab2a433e748ac1d1c13bde553bde7065c
    with:
      task: ${{ inputs.mac_ci_probe_mode == 'gui' && 'gui-probe' || 'probe' }}
      os: macos-latest
