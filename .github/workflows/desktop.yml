name: desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", "codex/ui/**", "codex/lib/**", "codex/cli-pin.json", "cli/internal/snapshot/**", "cli/internal/digest/**", "cli/internal/desktopcontract/**", "cli/internal/contracttest/**", "schema/**", "testdata/contract-v1/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "codex/ui/**", "codex/lib/**", "codex/cli-pin.json", "cli/internal/snapshot/**", "cli/internal/digest/**", "cli/internal/desktopcontract/**", "cli/internal/contracttest/**", "schema/**", "testdata/contract-v1/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Both editions: the official one from desktop/official-visuals/ (reserved license), then the
      # default community one, which must contain none of it.
      - run: npm run build:official
      - run: npm run build
      - run: |
          test ! -e app/dist/VISUAL-LICENSE.md
          grep -q '"edition": "community"' app/dist/build-edition.json
          cmp app/dist/app.css app/style.css
  shell:
    # The Rust shell on Linux (a supported Tauri target): format, unit tests, a debug build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci --ignore-scripts && npm run build
      - working-directory: desktop/src-tauri
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
  macos:
    # An unsigned (ad-hoc) Apple Silicon build with the pinned CLI bundled, for trying it out.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-cli.mjs aarch64-apple-darwin
      - run: npx tauri build --bundles app,dmg --config src-tauri/tauri.sidecar.conf.json -- --locked
      - run: codesign --verify --deep --verbose=2 "src-tauri/target/release/bundle/macos/ModelPlan Community.app"
      - name: Verify bundle display names and stable identifier
        run: |
          native_info="src-tauri/target/release/bundle/macos/ModelPlan Community.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$native_info")" = "ModelPlan Community"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$native_info")" = "ModelPlan Community"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$native_info")" = "ai.modelplan.community"
      - uses: actions/upload-artifact@v4
        with:
          name: Model-Plan-Community-macOS-arm64-unsigned
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  app-smoke:
    # The actual universal Community bundle, with no secrets, live reader or displayed UI.
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: false
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select newest installed Xcode for the release package
        run: |
          python3 - <<'PYCODE'
          import os, plistlib, re
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              version = plistlib.loads((app / 'Contents/Info.plist').read_bytes())['CFBundleShortVersionString']
              candidates.append((tuple(map(int, re.findall(r'\d+', version))), app))
          if not candidates:
              raise SystemExit('No installed Xcode')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={max(candidates)[1]}/Contents/Developer\n')
          PYCODE
      - name: Check smoke assertions and release identity negative controls
        run: python3 -m unittest discover -s desktop/native/tools/app-smoke -p 'test_*.py' -v
      - name: Fetch the current plugin CLI pin for the unverified smoke build
        run: python3 desktop/native/tools/distribution/release.py fetch-cli --pin codex/cli-pin.json --output "$RUNNER_TEMP/smoke-cli-archives"
      - name: Package the actual universal Community app with unverified consent identity
        run: bash desktop/native/tools/package-neutral.sh "$RUNNER_TEMP/smoke-cli-archives" "$RUNNER_TEMP/smoke-neutral-build" --unverified
      - name: Assert packaged production wiring (known baseline failures remain red)
        run: python3 desktop/native/tools/app-smoke/check-app-smoke.py "$RUNNER_TEMP/smoke-neutral-build/ModelPlan Community.app" "$RUNNER_TEMP/app-smoke-report" --expect-unverified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-app-smoke-report
          path: ${{ runner.temp }}/app-smoke-report/
          if-no-files-found: warn
          retention-days: 3

  native:
    name: native (${{ matrix.os }})
    # Standard free hosted images, newest installed Xcode; no signing or secrets.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select the newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          python3 - <<'PYCODE'
          import plistlib
          import re
          import subprocess
          from pathlib import Path

          candidates = []
          for app in Path("/Applications").glob("Xcode*.app"):
              with (app / "Contents/Info.plist").open("rb") as metadata:
                  version = plistlib.load(metadata)["CFBundleShortVersionString"]
              print(f"{app}: Xcode {version}", flush=True)
              candidates.append((tuple(map(int, re.findall(r"\d+", version))), str(app)))
          if not candidates:
              raise SystemExit("No installed Xcode found")
          selected = max(candidates)[1] + "/Contents/Developer"
          subprocess.run(["sudo", "xcode-select", "--switch", selected], check=True)
          PYCODE
      - name: Record OS and selected toolchain
        run: |
          sw_vers
          xcode-select --print-path
          xcodebuild -version
          swift --version
      - name: Build the neutral app and all native checks
        run: swift build --package-path desktop/native --jobs 2
      - name: Native lane XCTest suites (selection, instruments, cockpit shell and field)
        run: swift test --package-path desktop/native --jobs 2
      - name: Settings models and offscreen AppKit tests (no system effects)
        run: swift test --package-path desktop/native/ModelPlanSettings --scratch-path "$RUNNER_TEMP/settings-tests" --jobs 2
      - name: App settings application tests (no window or system effects)
        run: swift test --package-path desktop/native/ModelPlanAppIntegration --scratch-path "$RUNNER_TEMP/app-integration-tests" --jobs 2
      - name: Build the integrated Community entry without launching or packaging
        run: swift build --package-path desktop/native/ModelPlanAppIntegration --scratch-path "$RUNNER_TEMP/app-integration-tests" --jobs 2 --product ModelPlanCommunityApp
      - name: Field bridge protocol checks (synthetic page adapter)
        run: node --test desktop/native/ModelPlanField/WebTests/field-bridge.test.mjs
      - name: Dock native resource and instrument checks (neutral inputs)
        if: ${{ !cancelled() }}
        run: swift run --package-path desktop/native --skip-build ModelPlanDockInstrumentChecks "$RUNNER_TEMP/dock-instrument-checks"
      - name: Archive offscreen Dock visual probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dock-visual-${{ matrix.os }}
          path: ${{ runner.temp }}/dock-instrument-checks/dock-visual/
          if-no-files-found: warn
          retention-days: 3
      - name: Dock logic unit checks
        run: swift run --package-path desktop/native --skip-build ModelPlanDockLogicChecks
      - name: Window/input native contracts
        run: swift run --package-path desktop/native --skip-build ModelPlanWindowProbe --checks
      - name: Archive latest-Xcode binaries for macOS 14 runtime checks
        if: matrix.os == 'macos-latest'
        run: |
          native_bin_dir=$(swift build --package-path desktop/native --show-bin-path)
          native_artifact_dir="$RUNNER_TEMP/native-runtime"
          mkdir -p "$native_artifact_dir"
          for native_binary in ModelPlanCommunity ModelPlanContractChecks ModelPlanContractV1Checks ModelPlanRunLoopChecks ModelPlanShellChecks ModelPlanPrimitiveChecks ModelPlanWindowProbe ModelPlanDockLogicChecks ModelPlanDockInstrumentChecks; do
            cp "$native_bin_dir/$native_binary" "$native_artifact_dir/"
            xcrun vtool -show-build "$native_bin_dir/$native_binary"
            otool -L "$native_bin_dir/$native_binary"
          done
          integrated_bin_dir=$(swift build --package-path desktop/native/ModelPlanAppIntegration --scratch-path "$RUNNER_TEMP/app-integration-tests" --show-bin-path)
          cp "$integrated_bin_dir/ModelPlanCommunityApp" "$native_artifact_dir/"
          xcrun vtool -show-build "$integrated_bin_dir/ModelPlanCommunityApp"
          otool -L "$integrated_bin_dir/ModelPlanCommunityApp"
          cp -R "$native_bin_dir/ModelPlanNative_ModelPlanContractChecks.bundle" "$native_artifact_dir/"
          cd "$native_artifact_dir"
          shasum -a 256 ModelPlanCommunity ModelPlanCommunityApp ModelPlanContractChecks ModelPlanContractV1Checks ModelPlanRunLoopChecks ModelPlanShellChecks ModelPlanPrimitiveChecks ModelPlanWindowProbe ModelPlanDockLogicChecks ModelPlanDockInstrumentChecks > SHA256SUMS
          # tar preserves executable modes and the adjacent SwiftPM fixture bundle.
          tar -czf "$RUNNER_TEMP/native-runtime.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: native-latest-xcode-macos14-runtime
          path: ${{ runner.temp }}/native-runtime.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Native contract suite
        run: swift run --package-path desktop/native --skip-build ModelPlanContractChecks
      - name: Frozen CLI desktop contract v1 goldens
        run: swift run --package-path desktop/native --skip-build ModelPlanContractV1Checks "$GITHUB_WORKSPACE/testdata/contract-v1"
      - name: Common-run-loop deadline check
        run: swift run --package-path desktop/native --skip-build ModelPlanRunLoopChecks
      - name: AppKit lifecycle and neutral surface checks
        run: swift run --package-path desktop/native --skip-build ModelPlanShellChecks
      - name: B05 primitive contracts
        run: swift run --package-path desktop/native --skip-build ModelPlanPrimitiveChecks
      - name: Synthetic fixture integrity
        run: python3 desktop/native/tools/check-fixture-manifests.py

  native-runtime:
    name: native runtime (macos-14, latest-Xcode binaries)
    needs: native
    # Still exercise latest-Xcode binaries if the older image cannot build them.
    if: ${{ !cancelled() }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-latest-xcode-macos14-runtime
          path: ${{ runner.temp }}/native-runtime-download
      - name: Verify macOS 14 host and unpack the original binaries
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 14
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/native-runtime"
          tar -xzf "$RUNNER_TEMP/native-runtime-download/native-runtime.tar.gz" -C "$RUNNER_TEMP/native-runtime"
          cd "$RUNNER_TEMP/native-runtime"
          shasum -a 256 --check SHA256SUMS
          file ModelPlanCommunity ModelPlanCommunityApp ModelPlanContractChecks ModelPlanContractV1Checks ModelPlanRunLoopChecks ModelPlanShellChecks ModelPlanWindowProbe ModelPlanDockLogicChecks ModelPlanDockInstrumentChecks
      # Execute the transferred binaries directly: no Swift invocation or rebuild.
      - name: Native contract suite on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanContractChecks"'
      - name: Frozen CLI desktop contract v1 goldens on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanContractV1Checks" "$GITHUB_WORKSPACE/testdata/contract-v1"'
      - name: Common-run-loop deadline check on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanRunLoopChecks"'
      - name: AppKit lifecycle and neutral surface checks on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanShellChecks"'
      - name: Dock native resource and instrument checks on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanDockInstrumentChecks" "$RUNNER_TEMP/dock-instrument-runtime"'
      - name: Dock logic unit checks on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanDockLogicChecks"'
      - name: Window/input native contracts on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanWindowProbe" --checks'
      - name: B05 primitive contracts on macOS 14
        run: '"$RUNNER_TEMP/native-runtime/ModelPlanPrimitiveChecks"'
      - name: Synthetic fixture integrity
        run: python3 desktop/native/tools/check-fixture-manifests.py
