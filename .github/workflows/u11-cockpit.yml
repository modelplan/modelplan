name: U11 cockpit web
on:
  pull_request:
    paths:
      - 'desktop/cockpit/**'
      - 'desktop/tests/cockpit/**'
      - 'desktop/official-visuals/**'
      - 'desktop/third-party/fonts/**'
      - 'schema/app-cli/**'
      - 'source-policy.json'
      - 'scripts/check-source-policy.mjs'
      - 'scripts/check-visual-pack.mjs'
      - '.github/workflows/u11-cockpit.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/cockpit/**'
      - 'desktop/tests/cockpit/**'
      - 'desktop/official-visuals/**'
      - 'desktop/third-party/fonts/**'
      - 'schema/app-cli/**'
      - 'source-policy.json'
      - 'scripts/check-source-policy.mjs'
      - 'scripts/check-visual-pack.mjs'
      - '.github/workflows/u11-cockpit.yml'
  # Merge queue (D112): merge_group has no paths filter; queue-scope applies the list above.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: u11-cockpit-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Merge queue only (D112): run the checks below on the group commit ("PR + latest main") when the group
  # changes a path from the pull_request list, unless the group commit's tree is the PR head's tree (the head
  # contains the base and its own run tested exactly this). Linux only; no Mac time in the queue.
  queue-scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_PATHS: ^(desktop/cockpit/|desktop/tests/cockpit/|desktop/official-visuals/|desktop/third-party/fonts/|schema/app-cli/|source-policy\.json$|scripts/check-source-policy\.mjs$|scripts/check-visual-pack\.mjs$|\.github/workflows/u11-cockpit\.yml$)
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          elif git diff --no-renames --name-only -z "$BASE" HEAD | grep -qzE "$QUEUE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group changes watched paths: running checks on the group commit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "group changes no watched path"
          fi

  webkit:
    needs: queue-scope
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-24.04-arm
    # The 747-test webkit suite runs ~20 minutes on the hosted arm runner (main's last
    # run: 19m57s); the old 20-minute cap cancelled healthy runs that grew past it.
    # +10 minutes cover one CI retry round (playwright retries: 1) on a loaded runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/cockpit/package-lock.json
      - run: npm ci --prefix desktop/cockpit --ignore-scripts
      - run: npm run check --prefix desktop/cockpit
      - run: npm test --prefix desktop/cockpit
      - name: Install the pinned headless WebKit and system font fallback
        working-directory: desktop/cockpit
        run: |
          npx playwright install --with-deps webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Record exact subject and browser profile
        run: |
          mkdir -p .tmp/u11
          git rev-parse HEAD > .tmp/u11/subject.txt
          node --version >> .tmp/u11/subject.txt
          node desktop/cockpit/node_modules/@playwright/test/cli.js --version >> .tmp/u11/subject.txt
      - name: WebKit lifecycle, callback counts and visual comparisons
        run: npm run test:webkit --prefix desktop/cockpit
      - name: Verify walk failure evidence and replay
        working-directory: desktop/cockpit
        run: |
          test -s .tmp/test-results/visual-capture/cockpit-closed-night.png
          test -s .tmp/test-results/visual-capture/cockpit-closed-night.json
          callback=$(find .tmp/test-results -name callback-counts.json -type f -print -quit)
          test -n "$callback"
          test -s "$callback"
          find .tmp/test-results -type f -print0 | sort -z | xargs -0 sha256sum > .tmp/walk-suite-evidence.sha256
          if COCKPIT_WALK_FORCE_FAILURE=1 npx playwright test --config ../tests/cockpit/playwright.config.mjs --output .tmp/walk-probe-results click-walk.spec.mjs --grep 'click walk: empty' > .tmp/walk-probe.log 2>&1; then
            cat .tmp/walk-probe.log
            exit 1
          fi
          cat .tmp/walk-probe.log
          grep -q 'synthetic walk artifact probe' .tmp/walk-probe.log
          test -s ../tests/cockpit/.tmp/walk/empty-failure.png
          test -s ../tests/cockpit/.tmp/walk/empty-failure.json
          COCKPIT_WALK_REPLAY=../tests/cockpit/.tmp/walk/empty-failure.json npx playwright test --config ../tests/cockpit/playwright.config.mjs --output .tmp/walk-probe-results click-walk.spec.mjs
          sha256sum --check .tmp/walk-suite-evidence.sha256
      - run: node scripts/check-source-policy.mjs
      - name: Preserve bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u11-webkit-${{ github.sha }}
          path: |
            .tmp/u11/
            desktop/cockpit/.tmp/test-results/
            desktop/cockpit/.tmp/official/bundle-manifest.json
            desktop/cockpit/.tmp/official/VISUAL-LICENSE.md
            desktop/tests/cockpit/.tmp/walk/
          include-hidden-files: true
          retention-days: 14

  # D489: full-cockpit visual check without committed baselines. Renders the four full-* scenes for the base and the
  # subject on this one runner with the same Playwright/WebKit and pixel-diffs them (desktop/tests/cockpit/visual-diff.mjs).
  # pull_request: the subject is the PR merge ref and the base its first parent, the main tip the ref was built on, so
  # the diff shows this PR's change only. merge_group: the group commit against merge_group.base_sha.
  # Once main's merge gate judges the reports (main's rules.mjs carries VISUAL_DIFF_MARKER), the job fails only when a
  # render or the diff breaks and modelplan-gates decides from its annotations (scripts/merge-gates/visual.mjs) against the
  # live `Visual-change:` line and VISUAL-ACCEPT comments. Until then (or when main's rules.mjs is unreadable) the job is
  # strict and fails on any changed pixel, as the retired baselines did, so no mixed-revision group skips both rules.
  visual:
    needs: queue-scope
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check out the base next to the subject
        id: base
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = merge_group ]; then
            base=$GROUP_BASE
            git fetch -q --no-tags --depth=1 origin "$base"
          else
            base=$(git rev-parse 'HEAD^1')
          fi
          git worktree add -q --detach .tmp/visual-base "$base"
          { echo "base=$base"; echo "subject=$(git rev-parse HEAD)"; echo "head=${PR_HEAD:-$(git rev-parse HEAD)}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/cockpit/package-lock.json
      - run: npm ci --prefix desktop/cockpit --ignore-scripts
      - name: Install the pinned headless WebKit and system font fallback
        working-directory: desktop/cockpit
        run: |
          npx playwright install --with-deps webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Render the subject
        working-directory: desktop/cockpit
        run: |
          node build.mjs --official
          COCKPIT_VISUAL_OUT="$GITHUB_WORKSPACE/.tmp/visual/subject" npx playwright test --config ../tests/cockpit/playwright.config.mjs visual-scenes.spec.mjs
      - name: Render the base with the same Playwright and WebKit
        run: |
          set -eu
          ln -s "$GITHUB_WORKSPACE/desktop/cockpit/node_modules" .tmp/visual-base/desktop/cockpit/node_modules
          spec=.tmp/visual-base/desktop/tests/cockpit/browser/visual-scenes.spec.mjs
          # A base made before D489 has no scene spec; it renders with the subject's copy.
          [ -f "$spec" ] || cp desktop/tests/cockpit/browser/visual-scenes.spec.mjs "$spec"
          cd .tmp/visual-base/desktop/cockpit
          node build.mjs --official
          COCKPIT_VISUAL_AREAS="$GITHUB_WORKSPACE/desktop/tests/cockpit/visual-areas.json" COCKPIT_VISUAL_OUT="$GITHUB_WORKSPACE/.tmp/visual/base" \
            npx playwright test --config ../tests/cockpit/playwright.config.mjs visual-scenes.spec.mjs
      - name: Diff base and subject
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # Read-only: main's scripts/merge-gates/rules.mjs, for the D489 rollout marker (strict mode until main judges reports).
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          SUBJECT: ${{ steps.base.outputs.subject }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          printf '%s' "$PR_BODY" > .tmp/visual/pr-body.txt
          node desktop/tests/cockpit/visual-diff.mjs --base .tmp/visual/base --head .tmp/visual/subject --out .tmp/visual/diff \
            --base-sha "$BASE" --subject-sha "$SUBJECT" --head-sha "$HEAD_SHA" --body-file .tmp/visual/pr-body.txt
      - name: Preserve the renders and diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-visual-diff-${{ github.sha }}
          path: .tmp/visual/diff/
          if-no-files-found: ignore
          retention-days: 14
