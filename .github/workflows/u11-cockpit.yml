name: U11 cockpit web
on:
  pull_request:
    paths:
      - 'desktop/cockpit/**'
      - 'desktop/tests/cockpit/**'
      - 'desktop/official-visuals/**'
      - 'desktop/third-party/fonts/**'
      - 'schema/app-cli/**'
      - 'source-policy.json'
      - 'scripts/check-source-policy.mjs'
      - 'scripts/check-visual-pack.mjs'
      - '.github/workflows/u11-cockpit.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/cockpit/**'
      - 'desktop/tests/cockpit/**'
      - 'desktop/official-visuals/**'
      - 'desktop/third-party/fonts/**'
      - 'schema/app-cli/**'
      - 'source-policy.json'
      - 'scripts/check-source-policy.mjs'
      - 'scripts/check-visual-pack.mjs'
      - '.github/workflows/u11-cockpit.yml'
  # Merge queue (D112): merge_group has no paths filter; queue-scope applies the list above.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: u11-cockpit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  # Merge queue only (D112): run the checks below on the group commit ("PR + latest main") when the group
  # changes a path from the pull_request list, unless the group commit's tree is the PR head's tree (the head
  # contains the base and its own run tested exactly this). Linux only; no Mac time in the queue.
  queue-scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_PATHS: ^(desktop/cockpit/|desktop/tests/cockpit/|desktop/official-visuals/|desktop/third-party/fonts/|schema/app-cli/|source-policy\.json$|scripts/check-source-policy\.mjs$|scripts/check-visual-pack\.mjs$|\.github/workflows/u11-cockpit\.yml$)
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 HEAD) x"
          if [ "$p1" = "$BASE" ] && [ "$extra" = x ] && git merge-base --is-ancestor "$BASE" "$p2" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "PR head $p2 contains the queue base: reusing its checks"
          elif git diff --no-renames --name-only -z "$BASE" HEAD | grep -qzE "$QUEUE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "group changes watched paths: running checks on the group commit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "group changes no watched path"
          fi

  webkit:
    needs: queue-scope
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.queue-scope.outputs.run == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/cockpit/package-lock.json
      - run: npm ci --prefix desktop/cockpit --ignore-scripts
      - run: npm run check --prefix desktop/cockpit
      - run: npm test --prefix desktop/cockpit
      - name: Install the pinned headless WebKit and system font fallback
        working-directory: desktop/cockpit
        run: |
          npx playwright install --with-deps webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Record exact subject and browser profile
        run: |
          mkdir -p .tmp/u11
          git rev-parse HEAD > .tmp/u11/subject.txt
          node --version >> .tmp/u11/subject.txt
          node desktop/cockpit/node_modules/@playwright/test/cli.js --version >> .tmp/u11/subject.txt
      - name: WebKit lifecycle, callback counts and visual comparisons
        run: npm run test:webkit --prefix desktop/cockpit
      - run: node scripts/check-source-policy.mjs
      - name: Preserve bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u11-webkit-${{ github.sha }}
          path: |
            .tmp/u11/
            desktop/cockpit/.tmp/test-results/
            desktop/cockpit/.tmp/official/bundle-manifest.json
            desktop/cockpit/.tmp/official/VISUAL-LICENSE.md
          retention-days: 14
