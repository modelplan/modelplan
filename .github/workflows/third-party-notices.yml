# SPDX-License-Identifier: MIT
name: third-party notices
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: notices-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ready PRs run the macOS leg only when something it tests changed; other events keep it.
  mac-scope:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: .github
      - id: scope
        run: |
          set -eu
          # A pull_request checkout is the merge commit, so its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -Eq '(^|/)Package\.(swift|resolved)$|^desktop/third-party/|^scripts/third-party-notices\.py$|^scripts/tests/test_third_party_notices\.py$|^\.github/workflows/third-party-notices\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  notices:
    needs: mac-scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && (github.event.pull_request.draft || needs.mac-scope.outputs.run != 'true') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare owned scratch
        run: mkdir -p .tmp/notices
      - name: Verify shipped coverage and generated notices
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python3 scripts/third-party-notices.py --swift-manifests
          else
            python3 scripts/third-party-notices.py
          fi
      - name: Coverage regressions and missing-entry negative controls
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/notices
        run: python3 -m unittest discover -s scripts/tests -p test_third_party_notices.py -v
      - name: Remove owned scratch
        if: always()
        run: rm -rf .tmp/notices
